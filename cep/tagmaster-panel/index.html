<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TagMaster 素材桥</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #12161c; color: #e6ebf2;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 12px; overflow: hidden;
    }
    .wrap { padding: 10px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
    .title { font-size: 13px; font-weight: 600; color: #f5c451; flex: none; }
    .row { display: flex; align-items: center; gap: 6px; flex: none; }
    input[type=text] {
      flex: 1; min-width: 0; background: #1d232c; border: 1px solid #2a323d;
      color: #e6ebf2; padding: 5px 8px; border-radius: 6px; outline: none; font-size: 12px;
    }
    input[type=text]:focus { border-color: #f5c451; }
    button {
      background: #1d232c; border: 1px solid #2a323d; color: #e6ebf2;
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; flex: none;
    }
    button:hover { border-color: #f5c451; color: #f5c451; }
    button.primary { background: #f5c451; border-color: #f5c451; color: #1a1408; font-weight: 600; }
    button.primary:hover { background: #ffd877; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .main { flex: 1; display: flex; gap: 8px; min-height: 0; }
    #list { flex: 1.2; overflow-y: auto; background: #171c24; border: 1px solid #2a323d; border-radius: 8px; min-height: 60px; }
    .item { display: flex; align-items: center; gap: 7px; padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #1f2630; }
    .item:hover { background: #1d232c; }
    .item.sel { background: #2a2f3a; }
    .item input { flex: none; pointer-events: none; }
    .item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prev { flex: 1; display: flex; flex-direction: column; background: #000; border: 1px solid #2a323d; border-radius: 8px; min-width: 0; }
    .prev video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #000; }
    .prev .ph { flex: 1; display: flex; align-items: center; justify-content: center; color: #5f6b7d; }
    .prev .pvname { padding: 5px 8px; color: #9ca3af; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid #2a323d; }
    .rowbtns { display: flex; gap: 6px; flex: none; }
    .stat { display: flex; align-items: center; gap: 6px; color: #9ca3af; flex: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex: 0 0 auto; }
    .dot.err { background: #e8735e; }
    .dot.idle { background: #64748b; }
    #detail { color: #d1d5db; word-break: break-word; }
    .hint { color: #5f6b7d; font-size: 11px; flex: none; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">TagMaster 素材桥</div>
    <div class="row">
      <input type="text" id="dir" placeholder="素材文件夹路径（素材库 / 作品文件夹）">
      <button id="browse">浏览…</button>
      <button id="load">载入</button>
    </div>
    <div class="row"><input type="text" id="q" placeholder="按文件名过滤…"></div>
    <div class="main">
      <div id="list"></div>
      <div class="prev">
        <video id="pv" controls muted playsinline style="display:none"></video>
        <div class="ph" id="pvp">点列表文件名预览视频</div>
        <div class="pvname" id="pvn">未选择</div>
      </div>
    </div>
    <div class="rowbtns">
      <button id="all">全选</button>
      <button id="none">清空</button>
      <button id="send" class="primary" disabled>导入选中（0）</button>
    </div>
    <div class="stat"><span id="dot" class="dot idle"></span><span id="status">启动中…</span></div>
    <div id="detail">也可以在 TagMaster 里点「发送到 Premiere」，这里会自动接收。</div>
    <div class="hint">点文件名＝预览视频；勾选框＝标记要导入。「浏览」由 TagMaster 弹窗（请保持 TagMaster 开着），直接输入路径也可以。</div>
  </div>
  <script src="./js/panel.js"></script>
</body>
</html>
